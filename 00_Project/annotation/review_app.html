<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>21 个小区 · 开铃像素审核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#172b3a;font:15px system-ui,sans-serif}header{padding:20px 26px;background:#173b48;color:white}h1{font-size:23px;margin:0 0 8px}header p{margin:0;color:#d7e7ed;line-height:1.5}main{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;padding:18px}aside,.card{background:white;border:1px solid #dce2e5;border-radius:10px;padding:14px}aside{align-self:start;position:sticky;top:10px}#list{max-height:66vh;overflow:auto;margin-top:10px}#list button{display:block;width:100%;text-align:left;margin:4px 0;font-size:12px}button,select,input,textarea{font:inherit}button{cursor:pointer;background:#fff;border:1px solid #becbd2;border-radius:6px;padding:8px 10px;color:#173b48}button:hover{background:#e8f0f5}button.active{border-color:#007eac;background:#dff2ff}button.primary{background:#176b79;color:#fff;border-color:#176b79}button:disabled{opacity:.45;cursor:default}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.title{display:flex;justify-content:space-between;align-items:center}h2{font-size:19px;margin:0}label{display:inline-flex;gap:6px;align-items:center}input[type=text]{border:1px solid #becbd2;border-radius:6px;padding:7px;max-width:220px}input[type=range]{width:100px}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}.views h3{font-size:14px;margin:8px 0}.viewport{height:430px;overflow:auto;background:#24343b;border:1px solid #ccd7dc}canvas{display:block;image-rendering:pixelated;touch-action:none}#edit{cursor:crosshair}.muted{font-size:13px;color:#526979;line-height:1.6}.swatch{width:12px;height:12px;display:inline-block;border-radius:2px}textarea{width:100%;height:62px;border:1px solid #becbd2;border-radius:6px;padding:8px}.notice{padding:10px;background:#fff5dc;border-radius:6px;line-height:1.6}.status{margin:12px 0;font-size:14px;min-height:22px}.error{color:#a52719}.footer{margin-top:16px;padding-top:12px;border-top:1px solid #ddd}.ack{align-items:start;line-height:1.5;margin:12px 0}.ack input{margin-top:4px}#counter{font-weight:700}kbd{background:#edf1f3;padding:1px 5px;border-radius:3px}#pixel{font-variant-numeric:tabular-nums}@media(max-width:1000px){main{grid-template-columns:190px minmax(0,1fr)}.views{grid-template-columns:1fr}aside{padding:8px}.viewport{height:400px}}
</style>
<header><h1>开铃像素 · 21 张草稿待审核</h1><p>这是机器生成并经初步目视检查的辅助草稿。请检查整张原图，包括无着色的背景、暗处棉纤维和不确定区域；不要仅确认蓝色区域。</p></header>
<main><aside><div id="counter">正在载入…</div><div class="muted">✓ 表示已由你逐张确认。保存草稿不等于确认。</div><div id="list"></div><div class="footer"><button id="finish" disabled>全部审核完成，导出正式标注</button><p class="muted">最后一步记录真实审核者及 AI 辅助来源，不自动运行评分。</p></div></aside>
<section><div class="card"><div class="title"><h2 id="name">载入切片</h2><div><button id="prev">上一张</button> <button id="next">下一张</button></div></div>
<p id="warning" class="notice"></p>
<div class="toolbar"><label>审核人 <input id="reviewer" type="text" placeholder="填写真实姓名或署名"></label><span id="pixel" class="muted"></span></div>
<div class="toolbar"><button data-label="1" class="active"><i class="swatch" style="background:#00b4ff"></i> 棉纤维 1</button><button data-label="0"><i class="swatch" style="background:#d859a3"></i> 背景 0</button><button data-label="255"><i class="swatch" style="background:#f0a01e"></i> 不确定 255</button><select id="tool"><option value="brush">画笔</option><option value="polygon">多边形</option></select><label>笔径 <input id="brush" type="range" min="1" max="40" value="8"><span id="brushN">8 px</span></label><button id="fill" disabled>填充多边形</button><button id="cancel" disabled>取消多边形</button><button id="undo" disabled>撤销</button></div>
<div class="toolbar"><label>放大 <select id="zoom"><option value="1" selected>100%</option><option value="2">200%</option><option value="3">300%</option><option value="4">400%</option></select></label><label><input type="checkbox" id="show" checked>显示草稿</label><label><input type="checkbox" id="background">显示背景着色</label><label>透明度 <input id="opacity" type="range" min="10" max="90" value="50"></label><span class="muted">按住空格临时看原图；放大后滚动任一面板同步查看。</span></div>
<div class="views"><div><h3>原始 RGB · 不拉伸颜色</h3><div class="viewport" id="left"><canvas id="original" width="384" height="384"></canvas></div></div><div><h3>可编辑草稿 · 蓝色＝棉纤维，橙色＝不确定</h3><div class="viewport" id="right"><canvas id="edit" width="384" height="384"></canvas></div></div></div>
<p id="counts" class="muted"></p><label for="notes">备注（例如：条纹无法判读，保留不确定）</label><textarea id="notes"></textarea>
<label class="ack"><input id="ack" type="checkbox">我已检查整张原图及三类像素，修正可辨认的误标与漏标；保留的 255 确实无法可靠判读。确认的是 AI 辅助、经人工审核的标注。</label>
<div class="toolbar"><button id="save">保存草稿</button><button id="approve" class="primary">确认本张已审核</button></div><div id="status" class="status" role="status"></div>
</div></section></main>
<script>
const $=id=>document.getElementById(id);let items=[],records={},index=0,labels,valid,pixels,img,dirty=false,busy=false,pen=1,points=[],history=[],drag=false,last=null,peek=false;
const W=384,N=W*W,ctx=$('edit').getContext('2d'),orig=$('original').getContext('2d');
function msg(text,error=false){$('status').textContent=text;$('status').className='status'+(error?' error':'')}
async function api(path,data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'读取失败');return d}
function decode(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function encode(a){let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s)}
function list(){const done=items.filter(r=>records[r.image_id]?.reviewed).length;$('counter').textContent=`已审核 ${done} / ${items.length}`;$('finish').disabled=done!==items.length||dirty;$('list').replaceChildren();items.forEach((r,i)=>{const b=document.createElement('button');b.textContent=(records[r.image_id]?.reviewed?'✓ ':'○ ')+r.image_id;b.className=i===index?'active':'';b.onclick=()=>load(i);$('list').append(b)})}
function count(){let c=[0,0,0],v=0;for(let i=0;i<N;i++)if(valid[i]){v++;c[labels[i]===0?0:labels[i]===1?1:2]++}$('counts').textContent=`有效区域：背景 ${c[0].toLocaleString()} 像素 · 草稿棉纤维 ${c[1].toLocaleString()} 像素 · 不确定 ${c[2].toLocaleString()} 像素（${(100*c[2]/v).toFixed(1)}%）。这些数量不是精度指标。`}
function render(){if(!pixels)return;const d=new ImageData(new Uint8ClampedArray(pixels.data),W,W),a=Number($('opacity').value)/100;
 if($('show').checked&&!peek){for(let i=0;i<N;i++){const k=i*4;if(!valid[i]){d.data[k]=d.data[k+1]=d.data[k+2]=20;continue}let color=labels[i]===1?[0,180,255]:labels[i]===255?[240,160,30]:$('background').checked?[216,89,163]:null;if(color)for(let j=0;j<3;j++)d.data[k+j]=(1-a)*d.data[k+j]+a*color[j]}}
 ctx.putImageData(d,0,0);if(points.length){ctx.strokeStyle='#ff00d9';ctx.fillStyle='#ff00d9';ctx.lineWidth=1;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();for(const p of points)ctx.fillRect(p[0]-1,p[1]-1,3,3)}$('fill').disabled=points.length<3;$('cancel').disabled=!points.length;$('undo').disabled=!history.length}
function changed(){dirty=true;$('ack').checked=false;$('finish').disabled=true;msg('有未保存的修改。')}
function snapshot(){history.push(labels.slice());if(history.length>30)history.shift()}
async function load(i){if(busy||i<0||i>=items.length)return;if(dirty&&!confirm('当前修改未保存。确定放弃并切换？'))return;busy=true;try{const d=await api('/api/item/'+items[i].image_id);const picture=new Image();picture.src=d.image;await picture.decode();index=i;img=picture;labels=decode(d.labels);valid=decode(d.valid);orig.drawImage(img,0,0);pixels=orig.getImageData(0,0,W,W);dirty=false;history=[];points=[];$('notes').value=d.record.notes||'';$('ack').checked=false;$('reviewer').value=localStorage.getItem('boll-reviewer')||d.record.reviewer||'';$('name').textContent=`${i+1} / 21 · ${items[i].image_id}`;const n=items[i].artifact_rectangles_xyxy.length;$('warning').textContent=n?'本图有 '+n+' 处亮土或拼接异常区域被整块保留为不确定。请按原图重新判断；区域内若可辨认，也应补标。':'请重点检查暗处棉纤维、亮土、枯叶和边界混合像素。原生像素不足以判读时保留不确定。';$('left').scrollTop=$('right').scrollTop=0;$('left').scrollLeft=$('right').scrollLeft=0;list();render();count();msg(d.record.reviewed?'此图已确认；再次修改和保存会撤销其审核状态。':'尚未完成你的审核。')}catch(e){msg(e.message,true)}finally{busy=false}}
function xy(e){const r=$('edit').getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*W/r.height]}
function dab(x,y){const radius=Number($('brush').value)/2;for(let yy=Math.max(0,Math.floor(y-radius));yy<Math.min(W,Math.ceil(y+radius));yy++)for(let xx=Math.max(0,Math.floor(x-radius));xx<Math.min(W,Math.ceil(x+radius));xx++){const i=yy*W+xx;if(valid[i]&&(xx+.5-x)**2+(yy+.5-y)**2<=radius**2)labels[i]=pen}}
function line(a,b){const steps=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])*2);for(let i=0;i<=steps;i++){const t=steps?i/steps:0;dab(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t)}}
$('edit').onpointerdown=e=>{if(busy||!labels||e.button!==0)return;const p=xy(e);if($('tool').value==='polygon'){points.push(p);render();return}snapshot();drag=true;last=p;$('edit').setPointerCapture(e.pointerId);dab(...p);changed();render()};
$('edit').onpointermove=e=>{const p=xy(e),x=Math.floor(p[0]),y=Math.floor(p[1]);if(labels&&x>=0&&x<W&&y>=0&&y<W)$('pixel').textContent=`x ${x} · y ${y} · 当前值 ${labels[y*W+x]}`;if(drag){line(last,p);last=p;render()}};
function end(){if(drag){drag=false;count()}}$('edit').onpointerup=end;$('edit').onpointercancel=end;
$('fill').onclick=()=>{if(points.length<3)return;snapshot();const temp=document.createElement('canvas');temp.width=temp.height=W;const c=temp.getContext('2d');c.fillStyle='#fff';c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fill();const data=c.getImageData(0,0,W,W).data;for(let i=0;i<N;i++)if(valid[i]&&data[i*4+3]>=128)labels[i]=pen;points=[];changed();render();count()};
$('cancel').onclick=()=>{points=[];render()};$('tool').onchange=()=>{points=[];render()};$('undo').onclick=()=>{if(history.length){labels=history.pop();changed();render();count()}};
document.querySelectorAll('[data-label]').forEach(b=>b.onclick=()=>{pen=Number(b.dataset.label);document.querySelectorAll('[data-label]').forEach(x=>x.classList.toggle('active',x===b))});
$('brush').oninput=()=>$('brushN').textContent=$('brush').value+' px';$('zoom').onchange=()=>{for(const id of ['original','edit']){$(id).style.width=W*Number($('zoom').value)+'px';$(id).style.height=W*Number($('zoom').value)+'px'}};
for(const id of ['show','background','opacity'])$(id).oninput=render;
for(const pair of [['left','right'],['right','left']])$(pair[0]).onscroll=()=>{const a=$(pair[0]),b=$(pair[1]);if(b.scrollTop!==a.scrollTop)b.scrollTop=a.scrollTop;if(b.scrollLeft!==a.scrollLeft)b.scrollLeft=a.scrollLeft};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();peek=true;render()}if(e.key==='Escape'){points=[];render()}});document.addEventListener('keyup',e=>{if(e.code==='Space'){peek=false;render()}});window.addEventListener('blur',()=>{peek=false;end();render()});
$('notes').oninput=changed;$('reviewer').oninput=()=>localStorage.setItem('boll-reviewer',$('reviewer').value);
async function save(reviewed){if(busy)return;if(points.length){msg('请先填充或取消尚未完成的多边形。',true);return}if(reviewed&&(!$('ack').checked||!$('reviewer').value.trim())){msg('请填写真实审核人，并勾选整张切片已检查。',true);return}busy=true;try{const d=await api('/api/save',{image_id:items[index].image_id,labels:encode(labels),reviewer:$('reviewer').value,reviewed,full_review:$('ack').checked,notes:$('notes').value});records=d.state.items;dirty=false;list();msg(reviewed?'本张已确认并保存。可以切换下一张。':'草稿已保存；本张仍待你确认。')}catch(e){msg(e.message,true)}finally{busy=false}}
$('save').onclick=()=>save(false);$('approve').onclick=()=>save(true);$('prev').onclick=()=>load(index-1);$('next').onclick=()=>load(index+1);
$('finish').onclick=async()=>{if(dirty){msg('请先保存当前修改。',true);return}const who=$('reviewer').value.trim();if(!who){msg('请填写真实审核人。',true);return}if(!confirm(`确认 21 张均已逐张审核，将以“${who}”记录最终确认？\n将写入正式 completed_masks，并如实标明 AI 辅助、人工审核；不会运行评分。`))return;busy=true;try{const d=await api('/api/finalize',{reviewer:who,confirm:true});msg(d.message)}catch(e){msg(e.message,true)}finally{busy=false}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
api('/api/items').then(d=>{items=d.items;records=d.state.items;load(0)}).catch(e=>msg('请使用“启动标注审核.command”打开本页：'+e.message,true));
</script></html>
